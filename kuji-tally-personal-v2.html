<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>在庫数カウンター（個人用 v2）</title>
<!-- version: v2.8 (文字・ボタンの大きさを元に戻し、余白だけコンパクトに) -->
<style>
  :root {
    --ink: #2B2823;
    --bg: #F7F5F0;
    --line: #DDD6C8;
    --danger: #B4392F;
    --muted: #8A8272;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
  }
  button { font-family: inherit; cursor: pointer; }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 7px 14px;
    border-bottom: 1px solid var(--line);
  }
  .hrow { display: flex; align-items: center; gap: 6px; }
  .hrow + .hrow { margin-top: 6px; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; flex: 1; min-width: 0; }
  #saveState { font-size: 11px; color: var(--muted); }
  #saveState.error { color: var(--danger); }
  #eventSel {
    flex: 1; min-width: 0; height: 36px; font-size: 16px; font-weight: 700;
    border: 1px solid var(--ink); border-radius: 4px; background: #fff; color: var(--ink); padding: 0 8px;
  }
  .btn-sm {
    border: 1px solid var(--ink); background: #fff; color: var(--ink);
    border-radius: 4px; padding: 6px 10px; font-size: 13px; font-weight: 700; white-space: nowrap;
  }
  .btn-sm.on { background: var(--ink); color: var(--bg); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 12px; }

  .ev-panel {
    border: 1px solid var(--ink); border-radius: 4px; background: #fff; padding: 8px; margin-bottom: 12px;
  }
  .ev-panel h2 { font-size: 13px; margin: 0 0 6px; }
  .ev-panel .row { display: flex; gap: 6px; align-items: center; }
  .ev-head {
    margin: 14px 0 8px; padding: 8px 12px; font-size: 15px; font-weight: 700;
    background: var(--ink); color: var(--bg); border-radius: 4px;
  }
  .ev-head:first-child { margin-top: 0; }

  section.prize {
    border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 14px;
  }
  .section-title {
    padding: 8px 12px; font-size: 14px; font-weight: 700; color: #fff;
    display: flex; align-items: center; gap: 6px;
  }
  .title-input {
    flex: 1; min-width: 0; font-size: 16px; font-weight: 700;
    border: none; border-radius: 4px; padding: 6px 8px; background: rgba(255,255,255,0.92); color: var(--ink);
  }
  .tbtn {
    border: 1px solid rgba(255,255,255,0.9); background: transparent; color: #fff;
    border-radius: 4px; padding: 6px 8px; font-size: 12px; font-weight: 700; flex: none;
  }

  .item {
    display: flex; gap: 7px; padding: 4px 10px;
    border-bottom: 1px solid rgba(0,0,0,0.07);
  }
  .item:last-of-type { border-bottom: none; }
  .thumb {
    width: 48px; height: 48px; flex: none;
    border: 1px dashed var(--line); border-radius: 6px; background: #fff;
    padding: 0; overflow: hidden; font-size: 20px; line-height: 1;
  }
  .thumb.sm { width: 40px; height: 40px; font-size: 16px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item-main { flex: 1; min-width: 0; }
  .line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .name { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
  .name-input {
    flex: 1; min-width: 0; font-size: 16px; padding: 8px;
    border: 1px solid var(--line); border-radius: 4px; background: #fff;
  }
  .mv-btn {
    flex: none; width: 34px; height: 36px; border-radius: 4px;
    border: 1px solid var(--ink); color: var(--ink); background: #fff; font-size: 15px; padding: 0;
  }
  .mv-btn:disabled { opacity: 0.3; cursor: default; }
  .tbtn.mv { width: 34px; padding: 6px 0; text-align: center; }
  .tbtn:disabled { opacity: 0.35; cursor: default; }
  .guide h2 { font-size: 16px; margin: 0 0 8px; text-align: center; }
  .guide { max-height: 80vh; overflow-y: auto; }
  .guide h3 { font-size: 13px; margin: 12px 0 2px; }
  .guide p { font-size: 13px; line-height: 1.6; margin: 0; }
  .del-btn {
    flex: none; width: 36px; height: 36px; border-radius: 4px;
    border: 1px solid var(--danger); color: var(--danger); background: #fff; font-size: 16px; padding: 0;
  }
  .sub {
    margin-top: 4px; padding-left: 6px; font-size: 12px; color: #6d6659;
  }
  .counter { display: flex; align-items: center; gap: 6px; flex: none; }
  .counter button {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid;
    background: #fff; font-size: 18px; line-height: 1; padding: 0;
  }
  .counter button:disabled { opacity: 0.3; cursor: default; }
  .counter input {
    width: 48px; height: 34px; text-align: center; font-size: 16px;
    border: 1px solid var(--line); border-radius: 4px; background: #fff; padding: 0;
  }
  .counter.small button { width: 28px; height: 28px; font-size: 15px; }
  .counter.small input { width: 42px; height: 30px; }
  .neg { color: var(--danger); font-weight: 700; }
  .warn { margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--danger); }
  .toggle-alloc {
    margin-top: 6px; border: 1px solid var(--line); background: rgba(255,255,255,0.8);
    border-radius: 4px; padding: 6px 10px; font-size: 12px; color: var(--ink);
  }
  .alloc-panel {
    margin-top: 6px; padding: 7px; background: rgba(255,255,255,0.85);
    border: 1px solid var(--line); border-radius: 4px;
  }
  .alloc-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 0; border-bottom: 1px solid var(--line);
  }
  .alloc-row .pname { flex: 1; min-width: 80px; font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
  .alloc-row input.qty {
    width: 52px; height: 32px; text-align: center; font-size: 16px;
    border: 1px solid var(--line); border-radius: 4px; padding: 0;
  }
  .alloc-add { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .alloc-add select, .alloc-add input {
    height: 34px; font-size: 16px; border: 1px solid var(--line); border-radius: 4px; background: #fff; padding: 0 6px;
  }
  .alloc-add select { flex: 1; min-width: 100px; }
  .alloc-add input { width: 52px; text-align: center; }
  .alloc-add button {
    height: 34px; padding: 0 12px; border: none; border-radius: 4px;
    background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 700;
  }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .add-btn {
    display: block; width: calc(100% - 20px); margin: 8px 10px; padding: 10px;
    border: 1px dashed var(--ink); background: rgba(255,255,255,0.7);
    border-radius: 4px; font-size: 14px; font-weight: 700; color: var(--ink);
  }
  .add-btn.big { width: 100%; margin: 0 0 14px; background: #fff; }

  .manage { border: 1px solid var(--line); border-radius: 4px; padding: 10px; background: #fff; }
  .manage h2 { font-size: 14px; margin: 0 0 6px; }
  .manage button {
    display: block; width: 100%; padding: 12px; margin-bottom: 6px;
    font-size: 14px; font-weight: 700; border-radius: 4px;
    border: none; background: var(--ink); color: var(--bg);
  }
  .manage button.danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
  .manage button.plain { background: #fff; color: var(--ink); border: 1px solid var(--ink); }

  .partner-add { display: flex; gap: 8px; margin-bottom: 12px; }
  .partner-add input {
    flex: 1; min-width: 0; font-size: 16px; padding: 10px;
    border: 1px solid var(--line); border-radius: 4px; background: #fff;
  }
  .partner-add button {
    padding: 0 16px; border: none; border-radius: 4px;
    background: var(--ink); color: var(--bg); font-weight: 700; font-size: 14px;
  }
  .pcard { border: 1px solid var(--line); border-radius: 4px; background: #fff; margin-bottom: 8px; overflow: hidden; }
  .pcard-head {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px; border: none; background: #fff; font-size: 16px; font-weight: 700; text-align: left; color: var(--ink);
  }
  .badge { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: #EFE9DC; white-space: nowrap; }
  .pcard-body { border-top: 1px solid var(--line); padding: 4px 10px 10px; }
  .prow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .prow .info { flex: 1; min-width: 0; }
  .prow .iname { font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
  .prow .ptitle { font-size: 11px; color: var(--muted); }
  .prow .pqty { font-size: 15px; font-weight: 700; white-space: nowrap; }
  .pactions { display: flex; gap: 8px; margin-top: 12px; }
  .pactions button {
    flex: 1; padding: 10px; font-size: 13px; font-weight: 700; border-radius: 4px;
    border: 1px solid var(--ink); background: #fff; color: var(--ink);
  }
  .pactions button.danger { border-color: var(--danger); color: var(--danger); }
  .empty { padding: 12px 0; font-size: 13px; color: var(--muted); }

  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    background: var(--bg); border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; padding: 14px 8px; border: none; background: transparent;
    font-size: 14px; font-weight: 700; color: var(--muted);
  }
  nav button.active { color: var(--ink); box-shadow: inset 0 3px 0 var(--ink); }

  #toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom));
    z-index: 30; background: var(--danger); color: #fff; padding: 12px 14px;
    border-radius: 6px; font-size: 13px; font-weight: 700; display: none;
    max-width: 608px; margin: 0 auto;
  }
  .overlay {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.75);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .viewer { background: #fff; border-radius: 8px; padding: 12px; max-width: 100%; width: 420px; }
  .viewer img { width: 100%; max-height: 60vh; object-fit: contain; display: block; border-radius: 4px; background: #eee; }
  .viewer-name { font-size: 14px; font-weight: 700; margin: 8px 0; text-align: center; }
  .viewer-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .viewer-btns button {
    flex: 1; min-width: 90px; padding: 10px; font-size: 13px; font-weight: 700; border-radius: 4px;
    border: 1px solid var(--ink); background: #fff; color: var(--ink);
  }
  .viewer-btns button.danger { border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>在庫数カウンター（個人用 v2）</h1>
    <span id="saveState"></span>
    <button id="helpBtn" class="btn-sm" aria-label="使い方">?</button>
    <button id="editBtn" class="btn-sm">編集</button>
  </div>
  <div class="hrow" id="eventBar">
    <select id="eventSel" aria-label="イベントを選ぶ"></select>
    <button id="addEventBtn" class="btn-sm">＋ イベント</button>
  </div>
</header>

<div class="wrap" id="view"></div>

<div id="toast"></div>

<nav>
  <button id="tabStock" class="active">在庫</button>
  <button id="tabPartners">お取引相手</button>
</nav>

<input type="file" id="photoInput" accept="image/*" style="display:none">
<input type="file" id="importInput" accept=".json,application/json" style="display:none">

<script>
"use strict";

/* ========== 定数・ユーティリティ ========== */
const PALETTE = [
  { accent: "#3E6E96", bg: "#EAF1F7" },
  { accent: "#B8763C", bg: "#FBF1E6" },
  { accent: "#4E7A3E", bg: "#EEF4EA" },
  { accent: "#7A5591", bg: "#F3EDF5" },
  { accent: "#B4507A", bg: "#FBEDF3" },
  { accent: "#2F8A8A", bg: "#E8F4F4" },
  { accent: "#8A7A2F", bg: "#F6F3E4" },
  { accent: "#6B6B6B", bg: "#F0F0F0" }
];
const DB_NAME = "kuji-tally-personal-v2";

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const newItem = (name) => ({ id: uid(), name: name || "", count: 0, calling: 0, photoId: null });
const nm = (item) => item.name || "(名称未設定)";
const evName = (ev) => ev.name || "(名称未設定)";

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  const p = props || {};
  for (const k in p) {
    const v = p[k];
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el[k] = v;
    else if (k === "value" || k === "checked" || k === "disabled") el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c.nodeType ? c : String(c));
  }
  return el;
}

function parseNum(str) {
  const d = String(str).normalize("NFKC").replace(/[^0-9]/g, "");
  return d === "" ? 0 : parseInt(d, 10);
}

/* ========== 状態 ========== */
/* state = { events: [ { id, name, prizes, partners, allocs } ], currentId } */
let state = null;
let photos = {};           // photoId -> dataURL
let db = null;
let tab = "stock";
let editMode = false;
let focusId = null;
let pendingPhotoItemId = null;
const openItems = new Set();
const openPartners = new Set();

const cur = () => state.events.find((e) => e.id === state.currentId) || state.events[0];

function defaultPrizes() {
  const mk = (title, color, names) => ({ id: uid(), title, color, items: names.map(newItem) });
  return [
    mk("B賞", 0, ["ブクロ", "ヨコハマ", "シブヤ", "シンジュク", "ナゴヤ"]),
    mk("C賞", 1, ["一郎","二郎","三郎","左馬刻","銃兎","理鶯","乱数","幻太郎","帝統","寂雷","一二三","独歩","盧笙","空却","十四","獄"]),
    mk("D賞", 2, ["ブクロ", "ヨコハマ", "シブヤ", "シンジュク", "ナゴヤ"]),
    mk("E賞", 3, ["ブクロ","一郎","二郎","三郎","ヨコハマ","左馬刻","銃兎","理鶯","シブヤ","乱数","幻太郎","帝統","シンジュク","寂雷","一二三","独歩","盧笙","ナゴヤ","空却","十四","獄"])
  ];
}
function newEvent(name, prizes) {
  return { id: uid(), name: name, prizes: prizes || [], partners: [], allocs: [] };
}
function defaultState() {
  const ev = newEvent("イベント1", defaultPrizes());
  return { events: [ev], currentId: ev.id };
}

function normalizeEvent(e, fallbackName) {
  const out = { id: String(e.id || uid()), name: String(e.name !== undefined ? e.name : fallbackName), prizes: [], partners: [], allocs: [] };
  (Array.isArray(e.prizes) ? e.prizes : []).forEach((p) => {
    out.prizes.push({
      id: String(p.id || uid()),
      title: String(p.title || ""),
      color: Number.isInteger(p.color) ? p.color : 0,
      items: (Array.isArray(p.items) ? p.items : []).map((i) => ({
        id: String(i.id || uid()),
        name: String(i.name || ""),
        count: Number.isFinite(i.count) ? Math.trunc(i.count) : 0,
        calling: Number.isFinite(i.calling) ? Math.max(0, Math.trunc(i.calling)) : 0,
        photoId: i.photoId ? String(i.photoId) : null
      }))
    });
  });
  (Array.isArray(e.partners) ? e.partners : []).forEach((p) => {
    out.partners.push({ id: String(p.id || uid()), name: String(p.name || "") });
  });
  /* 旧版(v2.4以前)は「渡し済み」チェックがあり、チェックが入るまでは在庫を減らしていなかった。
     新版では、割当の数を入力した時点で常に在庫から引く方式にしたため、
     旧データの「まだ渡し済みでない」割当は、取り込むタイミングで一度だけ在庫から引いて辻褄を合わせる。 */
  (Array.isArray(e.allocs) ? e.allocs : []).forEach((a) => {
    const alloc = {
      id: String(a.id || uid()),
      itemId: String(a.itemId),
      partnerId: String(a.partnerId),
      qty: Number.isFinite(a.qty) ? Math.max(1, Math.trunc(a.qty)) : 1
    };
    out.allocs.push(alloc);
    if (a.delivered === false) {
      const f = findItem(out, alloc.itemId);
      if (f) f.item.count -= alloc.qty;
    }
  });
  return out;
}
/* 新形式(events)も旧形式(prizes/partners/allocs直下)も受け付ける */
function normalizeState(s) {
  let events;
  if (Array.isArray(s.events)) {
    events = s.events.map((e, i) => normalizeEvent(e, "イベント" + (i + 1)));
  } else {
    events = [normalizeEvent({ id: uid(), name: "イベント1", prizes: s.prizes, partners: s.partners, allocs: s.allocs }, "イベント1")];
  }
  if (events.length === 0) events = [newEvent("イベント1", [])];
  const currentId = events.some((e) => e.id === s.currentId) ? s.currentId : events[0].id;
  return { events: events, currentId: currentId };
}

/* ========== IndexedDB ========== */
function openDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error("IndexedDB unavailable")); return; }
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore("kv");
      r.result.createObjectStore("photos");
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
function idbGet(store, key) {
  return new Promise((resolve, reject) => {
    const q = db.transaction(store, "readonly").objectStore(store).get(key);
    q.onsuccess = () => resolve(q.result);
    q.onerror = () => reject(q.error);
  });
}
function idbAll(store) {
  return new Promise((resolve, reject) => {
    const out = {};
    const q = db.transaction(store, "readonly").objectStore(store).openCursor();
    q.onsuccess = () => {
      const c = q.result;
      if (c) { out[c.key] = c.value; c.continue(); } else resolve(out);
    };
    q.onerror = () => reject(q.error);
  });
}
function idbTx(store, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, "readwrite");
    fn(t.objectStore(store));
    t.oncomplete = () => resolve();
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}
const idbPut = (store, key, val) => idbTx(store, (s) => s.put(val, key));
const idbDelete = (store, key) => idbTx(store, (s) => s.delete(key));
const idbClear = (store) => idbTx(store, (s) => s.clear());

/* ========== 保存 ========== */
function setSaveState(text, isError) {
  const el = document.getElementById("saveState");
  el.textContent = text;
  el.classList.toggle("error", !!isError);
}
async function saveNow() {
  if (!db) { setSaveState("保存できません", true); return; }
  try {
    await idbPut("kv", "state", JSON.parse(JSON.stringify(state)));
    setSaveState("保存済み", false);
  } catch (e) {
    setSaveState("保存に失敗しました", true);
  }
}
function commit() {
  saveNow();
  render();
}
async function photoPut(id, dataUrl) {
  photos[id] = dataUrl;
  if (!db) return;
  try { await idbPut("photos", id, dataUrl); } catch (e) { setSaveState("写真の保存に失敗しました", true); }
}
async function photoDrop(id) {
  delete photos[id];
  if (!db) return;
  try { await idbDelete("photos", id); } catch (e) { /* 無視 */ }
}

/* ========== 検索・集計(イベント単位) ========== */
const partnerOf = (ev, id) => ev.partners.find((p) => p.id === id);
function findItem(ev, id) {
  for (const prize of ev.prizes) {
    const item = prize.items.find((i) => i.id === id);
    if (item) return { prize, item };
  }
  return null;
}
function findItemAny(id) {
  for (const ev of state.events) {
    const f = findItem(ev, id);
    if (f) return { ev, prize: f.prize, item: f.item };
  }
  return null;
}
function warnText(ev, item) {
  if (item.count < 0) return "⚠ 在庫がマイナスです";
  return "";
}
function itemOrder(ev, itemId) {
  let n = 0;
  for (const pr of ev.prizes) for (const it of pr.items) { if (it.id === itemId) return n; n++; }
  return 9999;
}

/* ========== 画面内ダイアログ(confirm/promptの代わり) ==========
   ホーム画面に追加した状態や、このチャットのプレビューなど、一部の環境では
   window.confirm / window.prompt が動かない(何も表示されない)ため使わない。 */
function askConfirm(message, okLabel) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (done) return; done = true; resolve(v); ov.remove(); };
    const ov = h("div", { class: "overlay", onclick: (e) => { if (e.target === ov) finish(false); } },
      h("div", { class: "viewer" },

function askText(title, defaultValue) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (done) return; done = true; resolve(v); ov.remove(); };
    const input = h("input", { class: "name-input", style: "width:100%", value: defaultValue || "", "aria-label": title,
      onkeydown: (e) => { if (e.key === "Enter") finish(input.value); } });
    const ov = h("div", { class: "overlay", onclick: (e) => { if (e.target === ov) finish(null); } },
      h("div", { class: "viewer" },
        h("div", { class: "viewer-name" }, title),
        input,
        h("div", { class: "viewer-btns", style: "margin-top:12px" },
          h("button", { onclick: () => finish(null) }, "キャンセル"),
          h("button", { onclick: () => finish(input.value) }, "OK")
        )

let toastTimer = null;
function toast(msg) {

/* ========== データ操作 ========== */
function moveIn(arr, idx, dir) {
  const to = idx + dir;
  if (to < 0 || to >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[to]; arr[to] = tmp;
  commit();
}
function removeItemData(ev, item) {
  if (item.photoId) photoDrop(item.photoId);
  ev.allocs = ev.allocs.filter((a) => a.itemId !== item.id);
  openItems.delete(item.id);
}
async function deleteItem(ev, prize, item) {
  if (!(await askConfirm("景品「" + nm(item) + "」を削除しますか？\n登録済みの取引相手への割当も消えます。この操作は取り消せません。"))) return;
  removeItemData(ev, item);
  prize.items = prize.items.filter((i) => i.id !== item.id);
  commit();
}
async function deletePrize(ev, prize) {
  if (!(await askConfirm("賞「" + (prize.title || "(名称未設定)") + "」を削除しますか？\n中の景品と、その割当も全て消えます。この操作は取り消せません。"))) return;
  prize.items.forEach((it) => removeItemData(ev, it));
  ev.prizes = ev.prizes.filter((p) => p.id !== prize.id);
  commit();
}
async function deletePartner(ev, p) {
  if (!(await askConfirm("お取引相手「" + (p.name || "(名称未設定)") + "」を削除しますか？\n登録済みの割当も消えます（割当の数だけ在庫に戻ります）。"))) return;
  ev.allocs.filter((a) => a.partnerId === p.id).forEach((a) => {
    const f = findItem(ev, a.itemId);
    if (f) f.item.count += a.qty;
  });
  ev.allocs = ev.allocs.filter((a) => a.partnerId !== p.id);
  ev.partners = ev.partners.filter((x) => x.id !== p.id);
  openPartners.delete(p.id);
  commit();
}
async function deleteAlloc(ev, a) {
  if (!(await askConfirm("この割当を削除しますか？\n在庫に" + a.qty + "個戻ります。"))) return;
  const f = findItem(ev, a.itemId);
  if (f) f.item.count += a.qty;
  ev.allocs = ev.allocs.filter((x) => x.id !== a.id);
  commit();
}
function addAlloc(ev, item, partnerId, qty) {
  if (!partnerId) { toast("お取引相手を選んでください"); return; }
  const n = Math.max(1, qty);
  const existing = ev.allocs.find((a) => a.itemId === item.id && a.partnerId === partnerId);
  if (existing) existing.qty += n;
  else ev.allocs.push({ id: uid(), itemId: item.id, partnerId, qty: n });
  item.count -= n;
  openItems.add(item.id);
  const w = warnText(ev, item);
  if (w) toast("「" + nm(item) + "」" + w);
  else if (item.count < 0) toast("「" + nm(item) + "」の在庫が足りません（" + item.count + "個）");
  commit();
}
function setAllocQty(ev, a, value) {
  const f = findItem(ev, a.itemId);
  const n = Math.max(1, value);
  if (f) {
    f.item.count += a.qty - n;
    a.qty = n;
    const w = warnText(ev, f.item);
    if (w) toast("「" + nm(f.item) + "」" + w);
  } else {
    a.qty = n;
  }
  commit();
}

/* ========== 写真 ========== */
function readAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error || new Error("ファイルを読めませんでした"));
    r.readAsDataURL(file);
  });
}
function loadImageEl(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("画像の形式を解釈できませんでした"));
    img.src = src;
  });
}
/* 画像を読み込み、{ source, w, h } を返す。方法1(createImageBitmap)が失敗したら方法2(FileReader+Image)に切り替える */
async function decodeImage(file) {
  if (window.createImageBitmap) {
    try {
      const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
      return { source: bmp, w: bmp.width, h: bmp.height };
    } catch (e1) {
      try {
        const bmp = await createImageBitmap(file);
        return { source: bmp, w: bmp.width, h: bmp.height };
      } catch (e2) { /* 方法2へ */ }
    }
  }
  const dataUrl = await readAsDataURL(file);
  const img = await loadImageEl(dataUrl);
  return { source: img, w: img.naturalWidth, h: img.naturalHeight };
}
async function fileToDataURL(file) {
  let dec;
  try {
    dec = await decodeImage(file);
  } catch (e) {
    throw new Error("画像を読み込めませんでした（形式: " + (file.type || "不明") + "、" + Math.round((file.size || 0) / 1024) + "KB）");
  }
  const max = 800;
  const s = Math.min(1, max / Math.max(dec.w, dec.h));
  const cw = Math.max(1, Math.round(dec.w * s));
  const ch = Math.max(1, Math.round(dec.h * s));
  const c = document.createElement("canvas");
  c.width = cw; c.height = ch;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, cw, ch);
  ctx.drawImage(dec.source, 0, 0, cw, ch);
  if (dec.source.close) dec.source.close();
  const out = c.toDataURL("image/jpeg", 0.8);
  if (!out || out.length < 100) throw new Error("画像を縮小できませんでした（端末のメモリ不足の可能性）");
  return out;
}
function pickPhoto(itemId) {
  pendingPhotoItemId = itemId;

}
document.getElementById("photoInput").onchange = async (e) => {
  const input = e.target;

  try {
    if (!file || !f) return;

    if (f.item.photoId) await photoDrop(f.item.photoId);
    const id = uid();
    await photoPut(id, dataUrl);
    f.item.photoId = id;
    commit();
  } catch (err) {

  } finally {
    /* iPhoneでは読み込みが終わる前に選択をクリアすると失敗することがあるため、最後にクリアする */
    input.value = "";

};

function download(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
const safeName = (s) => String(s).replace(/[\\/:*?"<>|]/g, "_").slice(0, 40) || "イベント";

function exportText() {
  const ev = cur();
  const L = [];
  L.push("在庫数一覧（個人用）");
  L.push("イベント: " + evName(ev));
  L.push("出力日: " + new Date().toLocaleString("ja-JP"));
  L.push("");
  ev.prizes.forEach((prize) => {
    L.push("【" + (prize.title || "名称未設定") + "】");
    prize.items.forEach((item) => L.push(nm(item) + ": " + item.count + "（声掛け中: " + item.calling + "）"));
    L.push("");
  });
  download("在庫数_" + safeName(evName(ev)) + "_" + stamp() + ".txt", new Blob([L.join("\n")], { type: "text/plain;charset=utf-8" }));
}
function exportBackup() {
  const data = { app: "kuji-tally-personal", version: 3, exportedAt: new Date().toISOString(), state: state, photos: photos };
  download("kuji-tally-backup_" + stamp() + ".json", new Blob([JSON.stringify(data)], { type: "application/json" }));
}
document.getElementById("importInput").onchange = async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const okShape = data && (data.version === 3 || data.version === 2) && data.state &&
      (Array.isArray(data.state.events) || Array.isArray(data.state.prizes));
    if (!okShape) throw new Error("バックアップファイルの形式が違います");
    if (!(await askConfirm("現在のデータを全て、このバックアップの内容で置き換えます。よろしいですか？", "置き換える"))) return;
    state = normalizeState(data.state);
    photos = {};
    const src = data.photos && typeof data.photos === "object" ? data.photos : {};
    Object.keys(src).forEach((k) => { if (typeof src[k] === "string") photos[k] = src[k]; });
    if (db) {
      await idbClear("photos");
      for (const k of Object.keys(photos)) await idbPut("photos", k, photos[k]);
    }
    openItems.clear(); openPartners.clear();
    await saveNow();
    render();
    toast("バックアップを読み込みました");
  } catch (err) {
    toast("読み込めませんでした: " + (err.message || err));
  }
};
async function resetCounts() {
  const ev = cur();
  if (!(await askConfirm("「" + evName(ev) + "」の在庫数と声掛け中の数を0にリセットしますか？\n（他のイベントには影響しません。景品・写真・お取引相手・割当は残ります。この操作は取り消せません）", "リセットする"))) return;
  ev.prizes.forEach((p) => p.items.forEach((i) => { i.count = 0; i.calling = 0; }));
  commit();
}

/* ========== 使い方案内 ========== */
const GUIDE = [
  ["イベント（複数のくじ）", "画面上部のプルダウンで、くじ・イベントを切り替えます。「＋ イベント」で新しいイベントを作れます。イベントごとに、賞・景品・在庫・お取引相手が別々に管理されます。"],
  ["在庫の増減", "各景品の「−」「＋」で在庫数を変えます。数字の欄をタップして、直接入力もできます。手動の「−」は0で止まります。"],
  ["声掛け中", "景品の下の「└ 声掛け中」で、今いくつ声をかけているかを数えます。在庫数には影響しません。"],
  ["賞・景品の編集", "右上の「編集」を押すと、賞と景品の名前を自由に書き換えたり、追加・削除・並べ替え（↑↓）ができます。イベントの名前変更・並べ替え・削除も、編集モードの先頭でできます。終わったら「編集を終える」を押します。削除すると、その景品への割当も消えます。"],
  ["写真", "景品の左にあるカメラの枠をタップして、写真を1枚登録します。登録後にタップすると、拡大表示・変更・削除ができます。"],
  ["お取引相手と割当", "画面下の「お取引相手」タブで、イベントごとに相手の名前を登録します。各景品の「お取引相手」ボタンを開くと、相手と数を割り当てられます。お取引相手タブでは、全イベント分の、相手ごとに渡す景品の一覧を見られます。"],
  ["お取引相手への割当", "相手と数を登録すると、その場ですぐに在庫からその数が引かれます。数を変更すると差分だけ在庫が増減し、割当を削除したり相手を削除したりすると、引かれていた分は在庫に戻ります。在庫が足りなくてもマイナスで登録でき、警告が出ます。"],
  ["バックアップ", "在庫タブの一番下から、全イベントのデータをファイルに書き出せます。機種変更や、ブラウザのデータを消す前に書き出しておくと安心です。読み込むと、今のデータが置き換わります。"],
  ["ホーム画面に追加", "iPhoneでは、Safariの共有ボタンから「ホーム画面に追加」して使うと、データが消えにくくなります。データはこの端末の中だけに保存され、他の人には見えません。"]
];
function showGuide() {
  const ov = h("div", { class: "overlay", onclick: (e) => { if (e.target === ov) ov.remove(); } },
    h("div", { class: "viewer guide" },
      h("h2", {}, "使い方"),
      GUIDE.map((g) => [h("h3", {}, g[0]), h("p", {}, g[1])]),
      h("div", { class: "viewer-btns", style: "margin-top:14px" },
        h("button", { onclick: () => ov.remove() }, "閉じる"))
    )
  );
  document.body.append(ov);
}

/* ========== 描画 ========== */
function renderEventBar() {
  const bar = document.getElementById("eventBar");
  bar.style.display = tab === "stock" ? "" : "none";
  const sel = document.getElementById("eventSel");
  sel.replaceChildren();
  state.events.forEach((ev) => {
    const o = document.createElement("option");
    o.value = ev.id;
    o.textContent = evName(ev);
    sel.append(o);
  });
  sel.value = cur().id;
}
function render() {
  document.getElementById("editBtn").style.display = tab === "stock" ? "" : "none";
  document.getElementById("editBtn").classList.toggle("on", editMode);
  document.getElementById("editBtn").textContent = editMode ? "編集を終える" : "編集";
  document.getElementById("tabStock").classList.toggle("active", tab === "stock");
  document.getElementById("tabPartners").classList.toggle("active", tab === "partners");
  const root = document.getElementById("view");
  root.replaceChildren();
  if (!state) return;
  renderEventBar();
  if (tab === "stock") renderStock(root); else renderPartners(root);
  if (focusId) {
    const el = document.querySelector('[data-id="' + focusId + '"]');
    if (el) el.focus();
    focusId = null;
  }
}
document.getElementById("helpBtn").onclick = showGuide;
document.getElementById("editBtn").onclick = () => { editMode = !editMode; render(); };
document.getElementById("eventSel").onchange = (e) => selectEvent(e.target.value);
document.getElementById("addEventBtn").onclick = addEvent;
document.getElementById("tabStock").onclick = () => { tab = "stock"; render(); window.scrollTo(0, 0); };
document.getElementById("tabPartners").onclick = () => { tab = "partners"; render(); window.scrollTo(0, 0); };

/* ========== 起動 ========== */
async function init() {
  try {
    db = await openDB();
    const saved = await idbGet("kv", "state");
    if (saved) {
      state = normalizeState(saved);
      photos = await idbAll("photos");
      await saveNow(); /* 旧形式だった場合は、新形式で保存し直す */
    } else {
      state = defaultState();
      photos = {};
      await saveNow();
    }
  } catch (e) {
    db = null;
    state = defaultState();
    photos = {};
    setSaveState("この環境では保存できません", true);
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  render();
  /* 初回だけ使い方を自動表示(保存できない環境では自動表示しない) */
  if (db) {
    try {
      const seen = await idbGet("kv", "guideSeen");
      if (!seen) {
        showGuide();
        await idbPut("kv", "guideSeen", true);
      }
    } catch (e) { /* 無視 */ }
  }
}
init();
</script>
